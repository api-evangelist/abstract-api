scope:
  kind: documentation-retrieval
  note: >-
    This is a DOCUMENTATION MCP server (Mintlify-hosted, served from Abstract's
    own docs host), not an API-operation server. Its tools read the Abstract docs
    corpus; none of them call an Abstract product endpoint. An agent can use it to
    learn how to call Abstract, but still has to make the HTTPS request itself.
    Recorded as an honest description of what is shipped, not a downgrade.

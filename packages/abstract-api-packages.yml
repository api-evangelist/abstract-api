  finding: >-
    Every first-party Abstract API client library was last published in 2021 —
    just over five years before this probe. The libraries also cover only four of
    Abstract's fifteen products (email validation, phone validation, IP geolocation,
    exchange rates); nothing was ever shipped for IP Intelligence, Company
    Enrichment, Email Reputation, VAT, IBAN, Holidays, Timezones, Avatars, Image
    Processing, Web Scraping or Website Screenshot. The Python libraries were never
    published to PyPI at all and exist only as GitHub repositories.
